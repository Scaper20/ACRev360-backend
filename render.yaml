databases:
  - name: acrev360-db
    plan: free
    databaseName: acrev360
    user: acrev360
    postgresMajorVersion: "17"

services:
  - type: web
    name: acrev360-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        # Two hosts, comma-separated (env.list() splits on commas — see
        # config/settings/prod.py) because this render.yaml is shared by two
        # separate Render services on two separate accounts: the original
        # acrev360-backend.onrender.com (already live before this file's
        # -wxu8 line existed — do not remove it) and a second service that
        # had to take the -wxu8 suffix because the plain name was already
        # taken when it was created. A version of this file with only the
        # -wxu8 host previously got merged to master and broke the first
        # service's ALLOWED_HOSTS check (every request 400'd) — see
        # docs/CHANGELOG.md. Listing both keeps either service's sync safe
        # regardless of which one actually reads this file.
        value: acrev360-backend.onrender.com,acrev360-backend-wxu8.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: acrev360-db
          property: connectionString
      # CORS_ALLOWED_ORIGINS and WEBHOOK_ENCRYPTION_KEY have no safe default —
      # fill these in from the Render dashboard after the frontend's Vercel URL
      # is known and a Fernet key is generated (see docs/DEPLOYMENT.md).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: WEBHOOK_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_STRICT_SIGNATURES
        value: "True"

# No cron/worker service here: Render Cron Jobs have a $1/mo minimum charge
# regardless of "plan" (no free instance type for them), so the daily
# debt-ageing refresh runs instead via a free GitHub Actions scheduled
# workflow that calls the existing POST /api/v1/debt/refresh endpoint — see
# .github/workflows/debt-ageing-refresh.yml and docs/DEPLOYMENT.md.

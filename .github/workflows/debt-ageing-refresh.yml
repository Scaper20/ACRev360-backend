name: Daily debt ageing refresh

# Free stand-in for Render Cron Jobs (which have a $1/mo minimum charge per
# job — no free instance type exists for them). Runs
# apps/enforcement/management/commands/refresh_debt_ageing.py directly
# against the database on a daily GitHub Actions schedule — genuinely free,
# no extra Render service.
#
# This calls the management command directly (checkout + pip install +
# manage.py) rather than hitting the deployed API over HTTP, on purpose: an
# HTTP call depends on the Render web service being awake/not suspended,
# which has repeatedly not held true (30-day free Postgres expiry, free-tier
# idle spin-down, an unexplained manual suspension — see docs/CHANGELOG.md).
# Running the command directly against the database sidesteps all of that,
# and as a bonus refreshes every active council in one pass instead of just
# the single council the old HTTP call was scoped to. See docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 02:00 Africa/Lagos
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfile's base image

      - name: Install dependencies
        run: pip install -r requirements/prod.txt

      - name: Refresh debt ageing for every active council
        env:
          DATABASE_URL: ${{ secrets.ACREV_DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: config.settings.prod
          # config.settings.prod requires these with no default and — since
          # the 2026-09-23 hardening pass — refuses to boot on the dev
          # fallback SECRET_KEY / WEBHOOK_ENCRYPTION_KEY. This job never
          # serves a request or decrypts a webhook secret, so it gets
          # throwaway values generated fresh each run (below) rather than
          # anything hardcoded in this public repo or shared with production.
          DJANGO_ALLOWED_HOSTS: localhost
          CORS_ALLOWED_ORIGINS: http://localhost
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export WEBHOOK_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python manage.py refresh_debt_ageing

name: Daily debt ageing refresh

# Free stand-in for Render Cron Jobs (which have a $1/mo minimum charge per
# job — no free instance type exists for them). Runs management commands
# directly against the database on a daily GitHub Actions schedule — genuinely
# free, no extra Render service.
#
# This calls the management commands directly (checkout + pip install +
# manage.py) rather than hitting the deployed API over HTTP, on purpose: an
# HTTP call depends on the Render web service being awake/not suspended,
# which has repeatedly not held true (30-day free Postgres expiry, free-tier
# idle spin-down, an unexplained manual suspension — see docs/CHANGELOG.md).
# Running against the database directly sidesteps all of that, and as a bonus
# refreshes every active council in one pass instead of just the single
# council the old HTTP call was scoped to. See docs/DEPLOYMENT.md.
#
# Two jobs, as separate steps so one failing never skips the other:
#   1. refresh_debt_ageing — the point of this workflow.
#   2. flushexpiredtokens — SimpleJWT rotates refresh tokens on every use
#      (ROTATE_REFRESH_TOKENS + BLACKLIST_AFTER_ROTATION), writing a new
#      outstanding_token row plus a blacklist row each time, and nothing ever
#      deleted them. At the intended scale (hundreds of active users, each
#      refreshing about twice an hour) that is ~5,000 rows/day, ~2.6 GB/year of
#      dead rows — enough to exhaust a free-tier database on its own.

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 02:00 Africa/Lagos
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.ACREV_DATABASE_URL }}
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # config.settings.prod requires these with no default, but this job never
      # serves a request.
      DJANGO_ALLOWED_HOSTS: localhost
      CORS_ALLOWED_ORIGINS: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the Dockerfile's base image

      - name: Install dependencies
        run: pip install -r requirements/prod.txt

      # Since the 2026-09-23 hardening pass prod settings refuse the dev
      # fallback SECRET_KEY / WEBHOOK_ENCRYPTION_KEY. This job never decrypts a
      # webhook secret or signs a token that matters, so both get throwaway
      # values generated fresh each run rather than anything hardcoded in this
      # public repo or shared with production.
      - name: Generate throwaway settings secrets
        run: |
          echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"
          echo "WEBHOOK_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Refresh debt ageing for every active council
        run: python manage.py refresh_debt_ageing

      - name: Purge expired login tokens
        if: always()
        run: python manage.py flushexpiredtokens

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: acrev360
      POSTGRES_USER: acrev360
      POSTGRES_PASSWORD: acrev360
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # Host port 5433, not 5432 — this machine already has a native PostgreSQL
      # service bound to 5432; mapping Docker's postgres to the same host port
      # creates an ambiguous double-listener (confirmed via `netstat`: two PIDs
      # both claiming 0.0.0.0:5432). Inter-container traffic (web, celery) still
      # uses the normal internal port 5432 — only the host-facing mapping moves.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acrev360"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380 — same reasoning as postgres above (6379 also showed a
      # pre-existing listener on this machine).
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    environment:
      DATABASE_URL: postgres://acrev360:acrev360@postgres:5432/acrev360
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    entrypoint: []
    command: celery -A config worker --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://acrev360:acrev360@postgres:5432/acrev360
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    entrypoint: []
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://acrev360:acrev360@postgres:5432/acrev360
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:

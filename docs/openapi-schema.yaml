        channel_code:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        bank_txn_ref:
          type: string
          maxLength: 64
        txn_status:
          allOf:
          - $ref: '#/components/schemas/TxnStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        full_name:
          type: string
          readOnly: true
        payer_ref:
          type: string
          readOnly: true
        terminal:
          type: integer
          nullable: true
        terminal_code:
          type: string
          readOnly: true
        posted_by:
          type: integer
          nullable: true
        posted_by_name:
          type: string
          readOnly: true
        receipt_ref:
          type: string
          readOnly: true
        qr_token:
          type: string
          readOnly: true
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocation'
          readOnly: true
      required:
      - allocations
      - amount
      - bill
      - bill_ref
      - channel
      - channel_code
      - created_at
      - full_name
      - id
      - payer_ref
      - payment_ref
      - posted_by_name
      - qr_token
      - receipt_ref
      - terminal_code
      - txn_status
    PaymentAllocation:
      type: object
      description: |-
        How much of a payment landed on which bill line — the FIFO breakdown
        itself (see payments.services.post_payment), not just each line's
        resulting paid_amount total. Nested off Payment/Receipt rather than a
        dedicated endpoint, matching how this codebase already nests BillLine
        detail off Bill/Receipt elsewhere.
      properties:
        id:
          type: integer
          readOnly: true
        bill_line:
          type: integer
          readOnly: true
        harmonised_code:
          type: string
          readOnly: true
        item_name:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - bill_line
      - created_at
      - harmonised_code
      - id
      - item_name
    PostPayment:
      type: object
      properties:
        bill_id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        channel_code:
          allOf:
          - $ref: '#/components/schemas/ChannelCodeEnum'
          default: POS
        bank_txn_ref:
          type: string
          default: ''
        terminal_id:
          type: integer
          nullable: true
        geo:
          type: object
          additionalProperties: {}
      required:
      - amount
      - bill_id
    PostPaymentRequest:
      type: object
      properties:
        bill_id:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        channel_code:
          allOf:
          - $ref: '#/components/schemas/ChannelCodeEnum'
          default: POS
        bank_txn_ref:
          type: string
          default: ''
        terminal_id:
          type: integer
          nullable: true
        geo:
          type: object
          additionalProperties: {}
      required:
      - amount
      - bill_id
    PublicBillLookup:
      type: object
      description: |-
        Shapes the public (unauthenticated) bill lookup response — payer identity
        plus bill/lines/arrears, matching what the print pages need.
      properties:
        bill_ref:
          type: string
        status:
          type: string
        due_date:
          type: string
          format: date
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        arrears_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        payer_ref:
          type: string
        full_name:
          type: string
        phone:
          type: string
        address:
          type: string
        ward_name:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BillLineDetail'
        superseded_bills:
          type: array
          items:
            $ref: '#/components/schemas/SupersededBill'
      required:
      - address
      - amount_paid
      - arrears_amount
      - balance
      - bill_ref
      - due_date
      - full_name
      - lines
      - payer_ref
      - phone
      - status
      - superseded_bills
      - total_amount
      - ward_name
    RateBand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
          description: The gazette's sub-classification name, e.g. 'Beer parlor'.
            Blank only when the item has exactly one band standing in for the whole
            item (no sub-classification), e.g. Communication Mast's single Large/Medium/Small
            triple.
        sort_order:
          type: integer
          readOnly: true
        rate_mode:
          allOf:
          - $ref: '#/components/schemas/RateBandRateModeEnum'
          readOnly: true
        flat_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        min_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        max_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RateTier'
          readOnly: true
      required:
      - flat_amount
      - id
      - label
      - max_amount
      - min_amount
      - rate_mode
      - sort_order
      - tiers
    RateBandEntryRateModeEnum:
      enum:
      - FLAT
      - RANGE
      - TIERED
      type: string
      description: |-
        * `FLAT` - FLAT
        * `RANGE` - RANGE
        * `TIERED` - TIERED
    RateBandEntryRequest:
      type: object
      description: |-
        One band in a `POST .../rate-bands` replacement set. `label` may be blank
        only when this is the item's single band (no gazetted sub-classification).
        Which of flat_amount / min_amount+max_amount / tiers is required depends on
        rate_mode — validated in apps.revenue.services._validate_band_spec, not here,
        so the error message can name the offending band by label.
      properties:
        label:
          type: string
          default: ''
          maxLength: 160
        rate_mode:
          $ref: '#/components/schemas/RateBandEntryRateModeEnum'
        flat_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        min_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        max_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/RateTierEntryRequest'
      required:
      - rate_mode
    RateBandRateModeEnum:
      enum:
      - FLAT
      - RANGE
      - TIERED
      type: string
      description: |-
        * `FLAT` - Flat
        * `RANGE` - Range
        * `TIERED` - Tiered
    RateTier:

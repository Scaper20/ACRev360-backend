    PatchedUpdateProfileRequest:
      type: object
      description: |-
        PATCH /auth/me — deliberately a narrow, separate serializer rather than
        reusing MeSerializer for writes too: username/council/role/consultant/
        access_level and the agent_*/consultant_* denormalized fields all stay
        admin-managed, not self-service. Only what's actually "my profile" is
        writable here.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 32
    Payer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payer_ref:
          type: string
          readOnly: true
        payer_type:
          $ref: '#/components/schemas/PayerTypeEnum'
        first_name:
          type: string
          maxLength: 100
        middle_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          description: |-
            Read-only display reconstruction — every consumer that only ever
            read this name (receipts, bill/payment/debt serializers, search
            result labels) keeps working unchanged; only ORM-level filtering and
            ordering had to move to the real first_name/middle_name/last_name
            columns, since a property isn't queryable at the database level.
          readOnly: true
        phone:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
          maxLength: 255
        ward:
          type: integer
        nin_bvn_hash:
          type: string
          maxLength: 128
        tin:
          type: string
          maxLength: 32
        business_size:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/BusinessSizeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        kyc_status:
          allOf:
          - $ref: '#/components/schemas/KycStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - first_name
      - full_name
      - id
      - kyc_status
      - payer_ref
      - payer_type
      - ward

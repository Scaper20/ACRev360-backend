components:
  schemas:
    APIClient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel:
          type: integer
        api_key:
          type: string
          readOnly: true
        is_active:
          type: boolean
      required:
      - api_key
      - channel
      - id
    APIClientRequest:
      type: object
      properties:
        channel:
          type: integer
        is_active:
          type: boolean
      required:
      - channel
    AgeingBucketEnum:
      enum:
      - '0_30'
      - '31_60'
      - '61_90'
      - OVER_90
      type: string
      description: |-
        * `0_30` - 0-30 days
        * `31_60` - 31-60 days
        * `61_90` - 61-90 days
        * `OVER_90` - 90+ days
    AppTokenObtainPairRequest:
      type: object
      description: |-
        Carries `council_id` on the access token itself so apps.tenancy.middleware can
        set the RLS context by decoding the token alone — no DB query needed before the
        tenant context is known. See apps/tenancy/middleware.py.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    AssetTypeEnum:
      enum:
      - PREMISES
      - SHOP
      - KIOSK
      - SIGNAGE
      type: string
      description: |-
        * `PREMISES` - Premises
        * `SHOP` - Shop
        * `KIOSK` - Kiosk
        * `SIGNAGE` - Signage
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        detail:
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        actor_ip:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_ip
      - actor_username
      - created_at
      - detail
      - entity_id
      - entity_type
      - id
    Bill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bill_ref:
          type: string
          readOnly: true
        payer:
          type: integer
          readOnly: true
        payer_ref:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        arrears_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BillStatusEnum'
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
        superseded_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount_paid
      - arrears_amount
      - balance
      - bill_ref
      - created_at
      - due_date
      - full_name
      - id
      - payer
      - payer_ref
      - status
      - superseded_by
      - total_amount
    BillLineDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        assessment:
          type: integer
          readOnly: true
        harmonised_code:
          type: string
          readOnly: true
        item_name:
          type: string
          readOnly: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        line_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - assessment
      - harmonised_code
      - id
      - item_name
      - line_amount
      - quantity
    BillLineEntry:
      type: object
      properties:
        revenue_item_id:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '1.00'
      required:
      - revenue_item_id
    BillLineEntryRequest:
      type: object
      properties:
        revenue_item_id:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '1.00'
      required:
      - revenue_item_id
    BillStatusEnum:
      enum:
      - ISSUED
      - PART_PAID
      - PAID
      - OVERDUE
      - CANCELLED
      - SUPERSEDED
      type: string
      description: |-
        * `ISSUED` - Issued
        * `PART_PAID` - Part Paid
        * `PAID` - Paid
        * `OVERDUE` - Overdue
        * `CANCELLED` - Cancelled
        * `SUPERSEDED` - Superseded
    BillsByStatus:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
      required:
      - count
      - status
    BlankEnum:
      enum:
      - ''
    BusinessSizeEnum:
      enum:
      - MICRO
      - SMALL
      - MEDIUM
      - LARGE
      type: string
      description: |-
        * `MICRO` - Micro
        * `SMALL` - Small
        * `MEDIUM` - Medium
        * `LARGE` - Large
    ChannelCatalogueEntry:
      type: object
      properties:
        id:
          type: integer
          nullable: true
        code:
          type: string
        label:
          type: string
        required_fields:
          type: array
          items:
            type: string
      required:
      - code
      - id
      - label
      - required_fields
    ChannelCodeEnum:
      enum:
      - POS
      - OTC
      - IB_MB
      - USSD
      - FIRSTMONIE
      type: string
      description: |-
        * `POS` - POS
        * `OTC` - Over-the-counter teller
        * `IB_MB` - Internet / Mobile Banking
        * `USSD` - USSD
        * `FIRSTMONIE` - FirstMonie Agent Banking
    CollectedByConsultant:
      type: object
      properties:
        consultant_name:
          type: string
        collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - collected
      - consultant_name
    CollectedByWard:
      type: object
      properties:
        ward_name:
          type: string
        collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - collected
      - ward_name
    CommissionSettlement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        consultant:
          type: integer
          readOnly: true
        consultant_name:
          type: string
          readOnly: true
        period_start:
          type: string
          format: date
          readOnly: true
        period_end:
          type: string
          format: date
          readOnly: true
        gross_collections:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        commission_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
        commission_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CommissionSettlementStatusEnum'
          readOnly: true
      required:
      - commission_amount
      - commission_rate
      - consultant
      - consultant_name
      - gross_collections
      - id
      - period_end
      - period_start
      - status
    CommissionSettlementStatusEnum:
      enum:
      - COMPUTED
      - APPROVED
      - SETTLED
      - DISPUTED
      type: string
      description: |-
        * `COMPUTED` - Computed
        * `APPROVED` - Approved
        * `SETTLED` - Settled
        * `DISPUTED` - Disputed
    Council:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        council_code:
          type: string
          maxLength: 16
        council_name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
          readOnly: true
        config:
          allOf:
          - $ref: '#/components/schemas/CouncilConfig'

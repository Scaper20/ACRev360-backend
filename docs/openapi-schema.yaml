openapi: 3.0.3
info:
  title: ACRev360 API
  version: 1.0.0
  description: Revenue administration & collection platform for FCT Area Councils.
paths:
  /api/v1/agents:
    get:
      operationId: v1_agents_list
      description: |-
        create stays COUNCIL_ADMIN/CONSULTANT/COUNCIL_IT (account-management,
        matching COUNCIL_IT's whole purpose per docs/RBAC_EXPANSION_DESIGN.md);
        list/retrieve widen further to CONSULTANT_STAFF/COUNCIL_AUDITOR/
        COUNCIL_IGR_HEAD/AGENT_SUPERVISOR — read-only additions, see
        get_permissions(). AGENT_SUPERVISOR's own further narrowing (own
        ward/team only) happens in get_queryset() via common.scoping.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by agent code or agent name
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldAgentList'
          description: ''
    post:
      operationId: v1_agents_create
      description: |-
        create stays COUNCIL_ADMIN/CONSULTANT/COUNCIL_IT (account-management,
        matching COUNCIL_IT's whole purpose per docs/RBAC_EXPANSION_DESIGN.md);
        list/retrieve widen further to CONSULTANT_STAFF/COUNCIL_AUDITOR/
        COUNCIL_IGR_HEAD/AGENT_SUPERVISOR — read-only additions, see
        get_permissions(). AGENT_SUPERVISOR's own further narrowing (own
        ward/team only) happens in get_queryset() via common.scoping.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAgent'
          description: ''
  /api/v1/agents/{id}:
    get:
      operationId: v1_agents_retrieve
      description: |-
        create stays COUNCIL_ADMIN/CONSULTANT/COUNCIL_IT (account-management,
        matching COUNCIL_IT's whole purpose per docs/RBAC_EXPANSION_DESIGN.md);
        list/retrieve widen further to CONSULTANT_STAFF/COUNCIL_AUDITOR/
        COUNCIL_IGR_HEAD/AGENT_SUPERVISOR — read-only additions, see
        get_permissions(). AGENT_SUPERVISOR's own further narrowing (own
        ward/team only) happens in get_queryset() via common.scoping.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAgent'
          description: ''
  /api/v1/agents/{id}/activity:
    get:
      operationId: v1_agents_activity_retrieve
      description: |-
        Recent payments posted by this agent — backs both the admin/
        consultant detail view and the mobile app's status view. The
        fieldops app (worklist, offline sync) builds on top of this rather
        than duplicating it — see fieldops.services.get_worklist.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivityResponse'
          description: ''
  /api/v1/agents/{id}/assign-payer:
    post:
      operationId: v1_agents_assign_payer_create
      description: |-
        Hands an already-registered payer to this specific agent —
        get_queryset() already scopes a CONSULTANT caller to their own
        agents, so reaching this for another firm's agent 404s before this
        body runs, same as `portfolio` above. Once assigned, the payer comes
        out of the general consultant-team pool for scoping purposes (see
        apps.common.scoping.portfolio_filter) — only this agent, and the
        consultant manager, see it from here on.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPayerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignPayerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignPayerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payer'
          description: ''
  /api/v1/agents/{id}/portfolio:
    get:
      operationId: v1_agents_portfolio_list
      description: |-
        Which revenue items this specific agent may handle — an optional
        further narrowing of their own consultant's ConsultantPortfolio (see
        AgentPortfolio's docstring). get_queryset() already scopes a
        CONSULTANT caller to their own agents, so no extra ownership check is
        needed here beyond get_object() itself — a consultant reaching this
        for another firm's agent 404s before this method body ever runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentPortfolio'
          description: ''
    post:
      operationId: v1_agents_portfolio_create
      description: |-
        Which revenue items this specific agent may handle — an optional
        further narrowing of their own consultant's ConsultantPortfolio (see
        AgentPortfolio's docstring). get_queryset() already scopes a
        CONSULTANT caller to their own agents, so no extra ownership check is
        needed here beyond get_object() itself — a consultant reaching this
        for another firm's agent 404s before this method body ever runs.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPortfolioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentPortfolioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentPortfolioRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolio'
          description: ''
  /api/v1/agents/{id}/portfolio/{portfolio_id}/end:
    post:
      operationId: v1_agents_portfolio_end_create
      description: |-
        create stays COUNCIL_ADMIN/CONSULTANT/COUNCIL_IT (account-management,
        matching COUNCIL_IT's whole purpose per docs/RBAC_EXPANSION_DESIGN.md);
        list/retrieve widen further to CONSULTANT_STAFF/COUNCIL_AUDITOR/
        COUNCIL_IGR_HEAD/AGENT_SUPERVISOR — read-only additions, see
        get_permissions(). AGENT_SUPERVISOR's own further narrowing (own
        ward/team only) happens in get_queryset() via common.scoping.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolio'
          description: ''
  /api/v1/api-clients:
    get:
      operationId: v1_api_clients_list
      description: |-
        DEVOPS_ADMIN (platform tier, council=null — docs/RBAC_EXPANSION_DESIGN.md)
        reads/manages integration keys across every active council, matching the
        matrix's "API keys, integration configs... no direct business-data edit
        rights needed" — it never gets access_level_permission on any billing/
        payment/payer viewset, only this one.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAPIClientList'
          description: ''
    post:
      operationId: v1_api_clients_create
      description: |-
        DEVOPS_ADMIN (platform tier, council=null — docs/RBAC_EXPANSION_DESIGN.md)
        reads/manages integration keys across every active council, matching the
        matrix's "API keys, integration configs... no direct business-data edit
        rights needed" — it never gets access_level_permission on any billing/
        payment/payer viewset, only this one.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIClient'
          description: ''
  /api/v1/api-clients/{id}:
    get:
      operationId: v1_api_clients_retrieve
      description: |-
        DEVOPS_ADMIN (platform tier, council=null — docs/RBAC_EXPANSION_DESIGN.md)
        reads/manages integration keys across every active council, matching the
        matrix's "API keys, integration configs... no direct business-data edit
        rights needed" — it never gets access_level_permission on any billing/
        payment/payer viewset, only this one.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIClient'
          description: ''
  /api/v1/api-clients/{id}/revoke:
    post:
      operationId: v1_api_clients_revoke_create
      description: |-
        The clean, audited way to deactivate a key — is_active is already
        the revocation flag (see APIClient), this just exposes flipping it
        through a real endpoint instead of a raw DB update.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIClient'
          description: ''
  /api/v1/assets:
    get:
      operationId: v1_assets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnumeratedAssetList'
          description: ''
    post:
      operationId: v1_assets_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumeratedAsset'
          description: ''
  /api/v1/audit:
    get:
      operationId: v1_audit_list
      description: |-
        Last 300 audit events. Council-tier: COUNCIL_ADMIN plus the
        RBAC-expansion COUNCIL_IGR_HEAD/COUNCIL_AUDITOR. Platform tier
        (council=null): COMPLIANCE_VIEW, EXTERNAL_AUDITOR (CouncilGrant-scoped,
        time-boxed), SUPER_ADMIN, PLATFORM_ADMIN — read across every council
        they're entitled to via apps.common.platform_scope, never an RLS bypass.
        See docs/RBAC_EXPANSION_DESIGN.md.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by actor username, action or entity type
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/change-password:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: access/refresh JWT pair. The access token carries council_id/access_level/consultant_id
        claims used to scope every subsequent request — see apps/tenancy/middleware.py.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProfile'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/bills:
    get:
      operationId: v1_bills_list
      parameters:
      - in: query
        name: consultant_id
        schema:
          type: integer
        description: Filter by the consultant whose user enumerated the bill's payer.
          Narrows within the caller's own scope — it never widens it for a CONSULTANT/REVENUE_OFFICER.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Issued on/after this date (inclusive)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Issued on/before this date (inclusive)
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: payer
        schema:
          type: integer
        description: Filter to one payer's bills
      - in: query
        name: q
        schema:
          type: string
        description: Search by bill reference or payer name
      - in: query
        name: revenue_item_id
        schema:
          type: integer
        description: Bills carrying a line for this revenue item
      - in: query
        name: status
        schema:
          type: string
        description: Filter by bill status
      - in: query
        name: value_max
        schema:
          type: number
        description: Maximum total_amount (inclusive)
      - in: query
        name: value_min
        schema:
          type: number
        description: Minimum total_amount (inclusive)
      - in: query
        name: ward_id
        schema:
          type: integer
        description: Filter by the bill's payer's ward
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: v1_bills_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBillResponse'
          description: ''
  /api/v1/bills/{bill_ref}:
    get:
      operationId: v1_bills_retrieve
      description: |-
        GET /api/v1/bills/<bill_ref> — public. Powers the demand-notice/demand-bill
        print pages and USSD option 1/2. Not part of BillViewSet's pk-based routing
        because bill_ref itself contains slashes (KAC/2026/000123).
      parameters:
      - in: path
        name: bill_ref
        schema:
          type: string
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBillLookup'
          description: ''
        '404':
          description: No response body
  /api/v1/bills/{id}:
    delete:
      operationId: v1_bills_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/bills/{id}/detail:
    get:
      operationId: v1_bills_detail_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillDetail'
          description: ''
  /api/v1/bills/{id}/lines:
    post:
      operationId: v1_bills_lines_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddLineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddLineRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillLineDetail'
          description: ''
  /api/v1/bills/{id}/lines/{line_id}:
    put:
      operationId: v1_bills_lines_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: line_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLineRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateLineRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateLineRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillLineDetail'
          description: ''
    delete:
      operationId: v1_bills_lines_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: line_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels:
    get:
      operationId: v1_channels_list
      description: 'Public: codes, modes and required fields.'
      tags:
      - channels
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelCatalogueEntry'
          description: ''
  /api/v1/channels/{code}/webhook:
    post:
      operationId: v1_channels_webhook_create
      description: Payload shape is channel-specific — see GET /api/v1/channels for
        the required-fields matrix per code.
      parameters:
      - in: path
        name: code
        schema:
          type: string

          type: array
          items:
            $ref: '#/components/schemas/Payment'
      required:
      - recent_payments
      - today_total
    AgentPortfolio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent:
          type: integer
          readOnly: true
        council_revenue_item:
          type: integer
        ward:
          type: integer
          nullable: true
        effective_from:
          type: string
          format: date
          readOnly: true
        effective_to:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - agent
      - council_revenue_item
      - effective_from
      - effective_to
      - id

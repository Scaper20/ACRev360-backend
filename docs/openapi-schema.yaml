components:
  schemas:
    APIClient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel:
          type: integer
        api_key:
          type: string
          readOnly: true
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null means the key never expires.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - api_key
      - channel
      - id
      - last_used_at
    APIClientRequest:
      type: object
      properties:
        channel:
          type: integer
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null means the key never expires.
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
      required:
      - channel
    AddLineRequest:
      type: object
      properties:
        revenue_item_id:
          type: integer
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          default: '1.00'
        rate_band_id:
          type: integer
          nullable: true
        rate_tier_id:
          type: integer
          nullable: true
        amount_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
      required:
      - revenue_item_id
    AgeingBucketEnum:
      enum:
      - '0_30'
      - '31_60'
      - '61_90'
      - OVER_90
      type: string
      description: |-
        * `0_30` - 0-30 days
        * `31_60` - 31-60 days
        * `61_90` - 61-90 days
        * `OVER_90` - 90+ days
    AgentActivityResponse:
      type: object
      properties:
        today_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$

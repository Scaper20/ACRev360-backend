openapi: 3.0.3
info:
  title: ACRev360 API
  version: 1.0.0
  description: Revenue administration & collection platform for FCT Area Councils.
paths:
  /api/v1/agents:
    get:
      operationId: v1_agents_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFieldAgentList'
          description: ''
    post:
      operationId: v1_agents_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FieldAgentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAgent'
          description: ''
  /api/v1/agents/{id}:
    get:
      operationId: v1_agents_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAgent'
          description: ''
  /api/v1/agents/{id}/activity:
    get:
      operationId: v1_agents_activity_retrieve
      description: |-
        Recent payments posted by this agent. The full daily-returns rollup
        (`agent_daily_return`, worklist, offline sync) is fieldops — deferred to
        V2_ARCHITECTURE.md §11 phase 4, out of this build pass.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldAgent'
          description: ''
  /api/v1/api-clients:
    get:
      operationId: v1_api_clients_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAPIClientList'
          description: ''
    post:
      operationId: v1_api_clients_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/APIClientRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIClient'
          description: ''
  /api/v1/api-clients/{id}:
    get:
      operationId: v1_api_clients_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIClient'
          description: ''
  /api/v1/assets:
    get:
      operationId: v1_assets_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnumeratedAssetList'
          description: ''
    post:
      operationId: v1_assets_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnumeratedAssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnumeratedAsset'
          description: ''
  /api/v1/audit:
    get:
      operationId: v1_audit_list
      description: Last 300 audit events — council admin only.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/bills:
    get:
      operationId: v1_bills_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBillList'
          description: ''
    post:
      operationId: v1_bills_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBill'
          description: ''
  /api/v1/bills/{bill_ref}:
    get:
      operationId: v1_bills_retrieve
      description: |-
        GET /api/v1/bills/<bill_ref> — public. Powers the demand-notice/demand-bill
        print pages and USSD option 1/2. Not part of BillViewSet's pk-based routing
        because bill_ref itself contains slashes (KAC/2026/000123).
      parameters:
      - in: path
        name: bill_ref
        schema:
          type: string
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicBillLookup'
          description: ''
        '404':
          description: No response body
  /api/v1/bills/{id}/detail:
    get:
      operationId: v1_bills_detail_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/v1/bills/{id}/lines:
    post:
      operationId: v1_bills_lines_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueBillRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueBill'
          description: ''
  /api/v1/bills/{id}/lines/{line_id}:
    put:
      operationId: v1_bills_lines_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
    delete:
      operationId: v1_bills_lines_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: line_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/channels:
    get:
      operationId: v1_channels_list
      description: 'Public: codes, modes and required fields.'
      tags:
      - channels
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelCatalogueEntry'
          description: ''
  /api/v1/channels/{code}/webhook:
    post:
      operationId: v1_channels_webhook_create
      description: Payload shape is channel-specific — see GET /api/v1/channels for
        the required-fields matrix per code.
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
          description: ''
  /api/v1/channels/OTC/settlement:
    post:
      operationId: v1_channels_OTC_settlement_create
      description: |-
        POST /api/v1/channels/OTC/settlement — end-of-day teller settlement file.
        Safe to re-send: already-received references are skipped, not re-posted.
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OTCSettlementRowRequest'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OTCSettlementRowRequest'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OTCSettlementRowRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTCSettlementResponse'
          description: ''
  /api/v1/channels/USSD/session:
    post:
      operationId: v1_channels_USSD_session_create
      description: |-
        Stateless menu driven entirely by the accumulated input string a telco
        gateway sends per keypress. 1 pay a bill, 2 check balance, 3 verify a receipt.
      tags:
      - channels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/USSDSessionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/USSDSessionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/USSDSessionRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: 'Raw text/plain: ''CON ...'' to continue the session, ''END
            ...'' to close it.'
  /api/v1/consultants:
    get:
      operationId: v1_consultants_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubConsultantList'
          description: ''
    post:
      operationId: v1_consultants_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
  /api/v1/consultants/{id}:
    get:
      operationId: v1_consultants_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
  /api/v1/consultants/{id}/portfolio:
    get:
      operationId: v1_consultants_portfolio_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
    post:
      operationId: v1_consultants_portfolio_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
  /api/v1/consultants/{id}/portfolio/{portfolio_id}/end:
    post:
      operationId: v1_consultants_portfolio_end_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: portfolio_id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
  /api/v1/consultants/{id}/status_change:
    post:
      operationId: v1_consultants_status_change_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubConsultantRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubConsultant'
          description: ''
  /api/v1/councils/onboard:
    post:
      operationId: v1_councils_onboard_create
      description: |-
        Platform-level bootstrap: create council -> configure -> ready for
        activate_template_item calls. Gated on Django's own is_superuser/is_staff, not
        a business access_level — creating a new tenant sits outside any existing
        council's context, see apps/tenancy/services.py.
      tags:
      - tenancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardCouncilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardCouncilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardCouncilRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Council'
          description: ''
  /api/v1/dashboard/global:
    get:
      operationId: v1_dashboard_global_retrieve
      description: |-
        Council admin / global view only — billed vs. collected by consultant (or
        Council Direct), matching the prototype's v_global_performance view.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardGlobalResponse'
          description: ''
  /api/v1/dashboard/summary:
    get:
      operationId: v1_dashboard_summary_retrieve
      description: |-
        Scoped to the caller's portfolio — see V2_ARCHITECTURE.md §5.
        `billed` is `total_amount - arrears_amount`, matching API_REFERENCE.md: an
        arrears segment rolled forward from a consolidation isn't counted as new
        billing, since it was already billed once on the bill it came from.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponse'
          description: ''
  /api/v1/debt:
    get:
      operationId: v1_debt_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDebtCaseList'
          description: ''
  /api/v1/debt/{id}/escalate:
    post:
      operationId: v1_debt_escalate_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCase'
          description: ''
  /api/v1/debt/refresh:
    post:
      operationId: v1_debt_refresh_create
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtCase'
          description: ''
  /api/v1/health:
    get:
      operationId: v1_health_retrieve
      description: For uptime checks, not an API status page.
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/v1/payers:
    get:
      operationId: v1_payers_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPayerList'
          description: ''
    post:
      operationId: v1_payers_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayerRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePayerRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePayerRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePayer'
          description: ''
  /api/v1/payers/{id}:
    get:
      operationId: v1_payers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:

          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        detail:
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_username:
          type: string
          readOnly: true
        actor_ip:
          type: string
          readOnly: true
          nullable: true
        created_at:
